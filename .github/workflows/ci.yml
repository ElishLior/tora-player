name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # next-env.d.ts and .next/types (route types) are generated, not committed.
      - name: Type-check
        run: npx next typegen && npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # No secrets: the build only needs the public config to exist. Supabase
      # points at a closed local port, so a build-time read fails fast and
      # never reaches production. Service-role, R2, VAPID and SMTP keys are
      # read at request time only.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
